name: Gem
description: 'Gem Security was a cloud detection and response (CDR) company, founded in 2022 in Tel Aviv,
  that built a real-time cloud threat detection, investigation, and response platform to shorten the time to
  investigate and contain cloud-native attacks. It raised roughly $34M from Team8, GGV/Notable Capital, IBM
  Ventures, Cisco Investments, and Silicon Valley CISO Investments, and was acquired by Wiz for about $350M in
  April 2024 to expand Wiz''s CDR offering. Gem no longer operates as an independent product: the gem.security
  domain permanently redirects to Wiz and there is no standalone Gem developer portal, public API, OpenAPI,
  SDK, or documentation surface to enrich. This record is retained as an acquired-company / portfolio lead.'
